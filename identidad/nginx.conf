server {
 listen 80;
 server_name _;
 server_tokens off;
 client_max_body_size 1m;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header X-Frame-Options DENY always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:8080; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self' http://localhost:8080" always;
 location / { try_files $uri $uri/ /index.html; }
 location = /health { proxy_pass http://api:8000/health; }
 location /api/ {
   proxy_pass http://api:8000;
   proxy_set_header Host $host;
   proxy_set_header Authorization $http_authorization;
   proxy_connect_timeout 5s;
   proxy_read_timeout 15s;
 }
}
