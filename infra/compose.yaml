name: cysa-s1
services:
  db:
    image: ${TIMESCALE_IMAGE:-timescale/timescaledb:2.19.3-pg17}
    environment:
      POSTGRES_DB: cysa
      POSTGRES_USER: cysa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Ejecutar tools/franco/preparar_local.py}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./sql/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ../inventario/sql/002_inventario.sql:/docker-entrypoint-initdb.d/002_inventario.sql:ro
    networks: [operacional]  # solo red interna: ni el panel ni Keycloak llegan a la base
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cysa -d cysa']
      interval: 5s
      timeout: 3s
      retries: 20
  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2.0.21}
    ports: ['127.0.0.1:8883:8883']
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./runtime/mqtt:/mosquitto/security:ro
    # borde existe solo para publicar 127.0.0.1:8883 al detector (una red internal no publica puertos)
    networks: [operacional, borde]
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    env_file: [./runtime/clientes/usuarios-api.env]
    environment: &database
      DB_HOST: db
      DB_NAME: cysa
      DB_USER: cysa
      DB_PASSWORD: ${DB_PASSWORD:?Credencial local requerida}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/cysa}
      OIDC_JWKS_URL: http://keycloak:8080/realms/cysa/protocol/openid-connect/certs
      OIDC_AUDIENCE: cysa-api
    networks: [operacional,panel]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  consumer:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    command: [python,-m,app.consumer]
    environment:
      <<: *database
      MQTT_HOST: mosquitto
      MQTT_PORT: '8883'
      MQTT_CA: /certs/ca.crt
      MQTT_USER: plataforma
      MQTT_PASSWORD: ${MQTT_PLATAFORMA_PASSWORD:?Credencial local requerida}
    volumes: ['./runtime/mqtt/ca.crt:/certs/ca.crt:ro']
    networks: [operacional]
    depends_on:
      db: {condition: service_healthy}
      mosquitto: {condition: service_started}
    restart: unless-stopped
  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.8.1}
    command: [start-dev,--import-realm,--spi-theme--static-max-age=-1,--spi-theme--cache-themes=false,--spi-theme--cache-templates=false]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Credencial local requerida}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HEALTH_ENABLED: 'true'
    ports: ['127.0.0.1:8080:8080']
    volumes:
      - ./runtime/keycloak:/opt/keycloak/data/import:ro
      - ../identidad/themes/cysa:/opt/keycloak/themes/cysa:ro
      - kcdata:/opt/keycloak/data
    networks: [panel]
  panel:
    image: ${NGINX_IMAGE:-nginx:1.30.6-alpine}
    ports: ['127.0.0.1:8088:80']
    volumes:
      - ../panel:/usr/share/nginx/html:ro
      - ../identidad/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api,keycloak]
    networks: [panel]
networks:
  operacional: {internal: true}  # db, broker, consumidor y API
  panel: {}                      # API, Keycloak y Nginx; la API es el unico enlace entre ambas
  borde: {}                      # solo el broker, para exponer 8883 en localhost
volumes:
  dbdata: {}
  kcdata: {}
